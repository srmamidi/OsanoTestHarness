# Prepare the agent: Python venv, pinned packages, Chromium, offline unit tests.
steps:
  - checkout: self
    clean: true
  - powershell: |
      # Any Python 3.12+ will do: try the launcher's newest 3.x, then python on PATH.
      $made = $false
      if (Get-Command py -ErrorAction SilentlyContinue) { & py -3 -m venv .venv; $made = ($LASTEXITCODE -eq 0) }
      if (-not $made -and (Get-Command python -ErrorAction SilentlyContinue)) { & python -m venv .venv; $made = ($LASTEXITCODE -eq 0) }
      if (-not $made) { throw 'No Python found on the agent (need 3.12 or newer)' }
      & .\.venv\Scripts\python.exe -c "import sys; sys.exit(0 if sys.version_info >= (3, 12) else 1)"
      if ($LASTEXITCODE -ne 0) { throw 'Python on the agent is older than 3.12' }
      & .\.venv\Scripts\python.exe -m pip install --disable-pip-version-check -q -r requirements.txt
      if ($LASTEXITCODE -ne 0) { throw 'pip install failed' }
      & .\.venv\Scripts\python.exe -m playwright install chromium
      if ($LASTEXITCODE -ne 0) { throw 'Chromium install failed' }
    displayName: Set up Python and Chromium
  - powershell: |
      & .\.venv\Scripts\python.exe -m pytest tests\test_units.py -q -p no:cacheprovider
      if ($LASTEXITCODE -ne 0) { throw 'harness unit tests failed - not trusting its results' }
    displayName: Self-test the harness (offline)
